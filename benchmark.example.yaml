schema_version: 1

clio:
  agent:
    repository: https://github.com/team-clio/clio-agent-graph.git
    revision: main
  server:
    repository: https://github.com/team-clio/clio-server.git
    revision: main

runtime:
  server_url: http://localhost:8080
  agent_url: http://localhost:2024
  tool_log_timeout_seconds: 30
  startup_timeout_seconds: 300
  case_timeout_seconds: 1800
  poll_interval_seconds: 5

evaluation:
  pass_threshold: 70
  llm_judge:
    enabled: false
    provider: openai
    # provider 기본값을 덮어쓸 때만 model, api_key_env, base_url을 지정한다.
    # model: gpt-4.1
    # api_key_env: OPENAI_API_KEY
    temperature: 0
    timeout_seconds: 60
    max_retries: 2
    max_source_chars: 20000
    prompt_version: v1
  weights:
    recall: 25
    precision: 20
    location_accuracy: 10
    root_cause_accuracy: 20
    explanation_quality: 10
    solution_validity: 10
    execution_reliability: 5

environment:
  agent: {}
  server: {}

# HTML은 실행 종료 후 자동 생성한다. LLM 서술은 Judge 설정을 기본값으로 재사용한다.
reporting:
  enabled: true
  llm:
    enabled: true
    # 필요할 때만 provider, model, api_key_env, base_url 등을 덮어쓴다.
    # provider: openai
    # model: gpt-4.1
    # api_key_env: REPORT_API_KEY
    prompt_version: report-v1
    max_input_chars: 60000
    max_case_chars: 4000

# 실제 키는 git에 포함되지 않는 benchmark.local.yaml에 입력한다.
secrets:
  agent: {}
  server: {}

suites:
  - name: feature-flags
    repository: https://github.com/team-clio/clio-benchmark-fixture-feature-flags.git
    revision: main
